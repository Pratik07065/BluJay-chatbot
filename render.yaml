services:
  - type: web
    name: blujay-chatbot-api
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT server:app
    envVars:
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant

      - key: GROQ_API_KEY
        sync: false
